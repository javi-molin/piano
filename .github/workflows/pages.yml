# Pruebas y publicación de Cascada.
#
# Las tres suites corren en cada pull request y en cada push a main. Publicar en
# GitHub Pages solo ocurre en main: el sitio es estático y no hay nada que
# compilar, se sube el repositorio tal cual menos los archivos de trabajo.
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pruebas del núcleo
        run: node tests/engine.test.mjs
      - name: Tokens de diseño alineados
        run: node tests/tokens.test.mjs
      - name: Instalar el navegador de pruebas
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Pruebas de navegador
        run: node tests/e2e.mjs

  publicar:
    needs: pruebas
    # En un pull request solo se corren las pruebas: publicar es cosa de main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest sw.js _site/
          cp -r src assets _site/
          cp README.md _site/ 2>/dev/null || true
      - name: Sellar la versión del caché con el commit
        run: |
          set -euo pipefail
          marca="cascada-${GITHUB_SHA:0:8}"
          sed -i "s/const VERSION = 'cascada-dev';/const VERSION = '$marca';/" _site/sw.js
          # Si no se pudo sellar, mejor fallar que publicar algo que los
          # dispositivos ya instalados no van a actualizar nunca.
          grep -q "const VERSION = '$marca';" _site/sw.js
          echo "Service worker sellado como $marca"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
